<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ApostolOS Engagements</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11182b">
  <style>
    body[data-engagement-demo-role="minister"] .legacy-assignment-index .invitation-actions,
    body[data-engagement-demo-role="minister"] .legacy-assignment-index .legacy-filter-group button:nth-child(2) {
      display: none !important;
    }
  </style>
</head>
<body>
  <script>
    (() => {
      // Known organization routes may select presentation before Angular starts.
      // The authenticated product response still verifies and owns tenant identity.
      const path = window.location.pathname.replace(/\/+$/, '') || '/';
      if (path === '/organization/ctg' || path.startsWith('/organization/ctg/')) {
        document.body.classList.add('eng-org-ctg');
      }
    })();
  </script>
  <app-root></app-root>
</body>
</html>
