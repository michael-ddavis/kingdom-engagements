name: One-time merged branch cleanup
on:
  push:
    branches: [cleanup/engagements-validation]
    paths: [.github/workflows/one-time-branch-cleanup.yml]
permissions: {}
jobs:
  prune:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete only audited merged branches with unchanged tips
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.parse, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          def api(path, method='GET'):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, method=method,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          candidates = [{'name': 'codex/apostolos-demo-readiness', 'sha': '26cf07c1a0ba367b18c9ca054cd8c2dfc3e0c008', 'pr': 42, 'merged_at': '2026-08-27T13:31:35Z'}, {'name': 'demo/ctg-presenter-ready-data', 'sha': '9c4631fe01446a92bb2537ea3713dcd6eef3817d', 'pr': 64, 'merged_at': '2026-09-23T17:48:15Z'}, {'name': 'demo/dwc-heyking-completion', 'sha': 'bf58c084b0279f253c94266aaf7cd6ada5d595d5', 'pr': 47, 'merged_at': '2026-09-22T19:58:14Z'}, {'name': 'feature/angular-client', 'sha': '216810cda7447b9b4ec4fda4926be968893671d5', 'pr': 37, 'merged_at': '2026-08-18T17:57:31Z'}, {'name': 'feature/angular-client-foundation', 'sha': 'd7bd7e756dd3979a6569ed77dcf371abe35abad9', 'pr': 36, 'merged_at': '2026-08-18T17:40:17Z'}, {'name': 'feature/distributed-runtime-object-storage', 'sha': 'ad8b292e67b377127a63e65e276aab3a0f9a025e', 'pr': 55, 'merged_at': '2026-09-22T22:06:51Z'}, {'name': 'feature/production-host-access', 'sha': '5d511fde9d05460fca446301ae1ab7957ac66647', 'pr': 51, 'merged_at': '2026-09-22T20:39:19Z'}, {'name': 'feature/production-secrets-observability', 'sha': '24711029fef9e3126a207728d577ca40883a4227', 'pr': 56, 'merged_at': '2026-09-22T23:36:58Z'}, {'name': 'feature/restore-assignment-care-network', 'sha': '571ef1756c607c288abe0d5dedb269f8d44b6b05', 'pr': 34, 'merged_at': '2026-08-18T14:44:06Z'}, {'name': 'fix/angular-root-white-screen', 'sha': '79873e73998d093b7bb3ad28f526e78c57ed606a', 'pr': 38, 'merged_at': '2026-08-18T18:37:04Z'}, {'name': 'fix/ctg-cross-module-identity', 'sha': '7a5897f411be347c1c8cdf64a7abf01395ddc99e', 'pr': 32, 'merged_at': '2026-08-18T02:04:08Z'}, {'name': 'fix/deterministic-demo-story', 'sha': '1272d81d4046cc1e11d09d72899a2f841383578e', 'pr': 41, 'merged_at': '2026-08-26T21:18:04Z'}, {'name': 'fix/docker-ignore-client-node-modules', 'sha': 'c464327c24133c761678d1f7fd0f88f868386607', 'pr': 61, 'merged_at': '2026-09-23T16:21:52Z'}, {'name': 'fix/engagements-final-ui-polish', 'sha': '038d186e953bc5e5408edb444590a0c3ccd16d00', 'pr': 40, 'merged_at': '2026-08-18T19:42:00Z'}, {'name': 'fix/engagements-workflow-ui', 'sha': '41a7d18b3e1691823537ef4ae0728d969c13d2a9', 'pr': 39, 'merged_at': '2026-08-18T19:10:39Z'}, {'name': 'fix/host-realtime-esbuild-docker', 'sha': '35f8a56b937fc75a25d21afc89b84ad3ca13d002', 'pr': 60, 'merged_at': '2026-09-23T16:13:03Z'}, {'name': 'fix/september-23-demo', 'sha': 'd2dd729adfba2022f924181a20b939c8e09a3093', 'pr': 65, 'merged_at': '2026-09-23T19:11:41Z'}, {'name': 'fix/shared-platform-auth-cookie', 'sha': '01b0d1c1aa32361eb7895e6828c26ad691205436', 'pr': 62, 'merged_at': '2026-09-23T16:40:07Z'}, {'name': 'hardening/foundation-v1-web-boundary', 'sha': 'b46b2462bf673ea5f0f1212455898c7c16541e2e', 'pr': 67, 'merged_at': '2026-09-24T13:19:05Z'}, {'name': 'integration/production-host-realtime', 'sha': '1be4bd2c270b7ec5eb1b28bd665adc08ab713383', 'pr': 54, 'merged_at': '2026-09-22T21:48:23Z'}, {'name': 'style/demo-polish-2026-08', 'sha': '8e37d48d7624ebd81fd07685e008f7d53d9c9645', 'pr': 33, 'merged_at': '2026-08-25T22:47:30Z'}]
          for item in candidates:
              name, sha, number = item['name'], item['sha'], item['pr']
              try:
                  branch = api('/branches/' + urllib.parse.quote(name, safe=''))
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print('Already absent: ' + name)
                      continue
                  raise
              pr = api('/pulls/' + str(number))
              if branch['protected'] or name in ('main', 'demo-ready') or branch['commit']['sha'] != sha:
                  raise RuntimeError('Branch changed or protected: ' + name)
              if not pr['merged'] or pr['head']['sha'] != sha:
                  raise RuntimeError('Merge proof changed: ' + name)
              if api('/pulls?state=open&head=' + urllib.parse.quote(repo.split('/')[0] + ':' + name, safe='')):
                  raise RuntimeError('Open work exists: ' + name)
              merge_sha = pr['merge_commit_sha']
              chain = [(37, '216810cda7447b9b4ec4fda4926be968893671d5'), (33, '8e37d48d7624ebd81fd07685e008f7d53d9c9645')] if number == 36 else ([(33, '8e37d48d7624ebd81fd07685e008f7d53d9c9645')] if pr['base']['ref'] != 'main' else [])
              for parent_number, parent_sha in chain:
                  parent_pr = api('/pulls/' + str(parent_number))
                  if not parent_pr['merged'] or parent_pr['head']['sha'] != parent_sha:
                      raise RuntimeError('Stacked merge proof changed: ' + name)
                  nested = api('/compare/' + merge_sha + '...' + parent_sha)
                  if nested['status'] not in ('ahead', 'identical'):
                      raise RuntimeError('Branch is not included in merged stack: ' + name)
                  merge_sha = parent_pr['merge_commit_sha']
              comparison = api('/compare/' + merge_sha + '...main')
              if comparison['status'] not in ('ahead', 'identical'):
                  raise RuntimeError('Merge is not on main: ' + name)
              api('/git/refs/heads/' + urllib.parse.quote(name, safe=''), method='DELETE')
              print('Deleted merged branch: ' + name + ' (PR #' + str(number) + ', ' + sha + ')')
