name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build Angular Engagements client
        working-directory: src/KingdomEngagements.Web/ClientApp
        run: |
          npm install
          npm run build:production

      - run: dotnet restore KingdomEngagements.slnx
      - run: dotnet build KingdomEngagements.slnx --configuration Release --no-restore
      - run: dotnet test KingdomEngagements.slnx --configuration Release --no-build
      - run: docker build --tag kingdom-engagements:ci .

      - name: Verify standalone Angular shell and public host flows
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach -e ASPNETCORE_ENVIRONMENT=Development kingdom-engagements:ci)"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if health_payload="$(docker exec "$container_id" curl --fail --silent http://localhost:8080/health 2>/dev/null)"; then
              if grep --quiet '"module":"engagements"' <<<"$health_payload"; then
                index_payload="$(docker exec "$container_id" curl --fail --silent http://localhost:8080/)"
                grep --quiet '<app-root' <<<"$index_payload"
                if grep --quiet '/legacy18-product.js' <<<"$index_payload"; then exit 1; fi
                if grep --quiet 'engagement-nav-root' <<<"$index_payload"; then exit 1; fi

                invitations_payload="$(docker exec "$container_id" curl --fail --silent http://localhost:8080/invitations)"
                grep --quiet '<app-root' <<<"$invitations_payload"
                assignments_page="$(docker exec "$container_id" curl --fail --silent http://localhost:8080/assignments)"
                grep --quiet '<app-root' <<<"$assignments_page"

                invite_payload="$(docker exec "$container_id" curl --fail --silent http://localhost:8080/invite/apostle-cynthia)"
                grep --quiet 'Invite Cynthia Thompson' <<<"$invite_payload"
                terms_status="$(docker exec "$container_id" sh -c "curl -o /dev/null -s -w '%{http_code}' http://localhost:8080/host/terms/not-a-real-token")"
                test "$terms_status" = "200"
                coordination_status="$(docker exec "$container_id" sh -c "curl -o /dev/null -s -w '%{http_code}' http://localhost:8080/host/coordination/not-a-real-token")"
                test "$coordination_status" = "200"

                assignments_payload="$(docker exec "$container_id" curl --fail --silent http://localhost:8080/api/engagements/assignments)"
                grep --quiet 'Kingdom Leadership Gathering' <<<"$assignments_payload"
                requests_payload="$(docker exec "$container_id" curl --fail --silent http://localhost:8080/api/engagements/requests)"
                grep --quiet 'eventName' <<<"$requests_payload"
                exit 0
              fi
            fi
            sleep 2
          done
          exit 1

      - name: Verify connected SQL and strict entitlement runtime
        shell: bash
        run: bash .github/scripts/connected-smoke.sh

      - name: Verify retained response follow-up and closeout backend lifecycle
        shell: bash
        run: bash .github/scripts/completion-smoke.sh
